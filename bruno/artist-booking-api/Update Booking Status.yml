info:
  name: Update Booking Status
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/bookings/10/status"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{artistToken}}
  body:
    type: json
    data: |-
      {
        "status": "completed"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
